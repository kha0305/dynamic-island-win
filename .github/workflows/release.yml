name: Release Portable Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Check Clippy and Unit Tests
        shell: pwsh
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Build Release Binary (Static CRT)
        shell: pwsh
        run: cargo build --release --locked

      - name: Package Portable Assets and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\win-dynamic-island.exe dist\win-dynamic-island.exe -Force
          $hash = (Get-FileHash dist\win-dynamic-island.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  win-dynamic-island.exe" | Set-Content -Path dist\win-dynamic-island.exe.sha256 -Encoding ASCII
          @'
          WIN DYNAMIC ISLAND - BẢN PORTABLE (WINDOWS 11 x64)

          1. Cách chạy:
             - Giải nén và chép win-dynamic-island.exe vào một thư mục cố định (ví dụ: C:\Apps\WinDynamicIsland\).
             - Bấm đúp để chạy ngay, không cần cài đặt Visual C++ Redistributable.
             - Nếu Windows hiện SmartScreen ở lần chạy đầu, chọn "More info" -> "Run anyway".

          2. Cập nhật tự động:
             - Nhấn chuột phải vào biểu tượng khay hệ thống -> chọn "Kiểm tra cập nhật" (hoặc cập nhật khi có thông báo phiên bản mới).
          '@ | Set-Content -Path dist\HUONG_DAN_SU_DUNG.txt -Encoding UTF8
          Compress-Archive -Path dist\win-dynamic-island.exe, dist\HUONG_DAN_SU_DUNG.txt -DestinationPath dist\WinDynamicIsland-win64.zip -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/win-dynamic-island.exe
            dist/win-dynamic-island.exe.sha256
            dist/WinDynamicIsland-win64.zip
