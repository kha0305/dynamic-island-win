name: Release Setup and Portable Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Check Clippy and Unit Tests
        shell: pwsh
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build Release App and Setup Installer (Static CRT)
        shell: pwsh
        run: |
          cargo build --release --locked --bin win-dynamic-island
          $env:WDI_SETUP_PAYLOAD = (Resolve-Path target\release\win-dynamic-island.exe).Path
          cargo build --release --locked --bin win-dynamic-island-setup

      - name: Package Setup, Portable Assets and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\win-dynamic-island.exe dist\win-dynamic-island.exe -Force
          Copy-Item target\release\win-dynamic-island-setup.exe dist\WinDynamicIsland-Setup.exe -Force
          $hashApp = (Get-FileHash dist\win-dynamic-island.exe -Algorithm SHA256).Hash.ToLower()
          "$hashApp  win-dynamic-island.exe" | Set-Content -Path dist\win-dynamic-island.exe.sha256 -Encoding ASCII
          $hashSetup = (Get-FileHash dist\WinDynamicIsland-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hashSetup  WinDynamicIsland-Setup.exe" | Set-Content -Path dist\WinDynamicIsland-Setup.exe.sha256 -Encoding ASCII
          @'
          WIN DYNAMIC ISLAND - BẢN PORTABLE CHẠY NGAY (WINDOWS 11 x64)

          1. Hai cách sử dụng tùy chọn:
             - Bản chạy ngay (Portable): Giải nén và chép win-dynamic-island.exe vào thư mục cố định rồi bấm đúp để chạy ngay.
             - Bản cài đặt chuẩn (Setup): Chạy WinDynamicIsland-Setup.exe nếu muốn cài vào hệ thống, tạo lối tắt Start Menu/Desktop và gỡ cài đặt trong Windows Settings.
             - Không cần cài đặt Visual C++ Redistributable.
             - Nếu Windows hiện SmartScreen ở lần chạy đầu, chọn "More info" -> "Run anyway".

          2. Cập nhật tự động:
             - Nhấn chuột phải vào biểu tượng khay hệ thống -> chọn "Kiểm tra cập nhật" (hoặc cập nhật khi có thông báo phiên bản mới).
          '@ | Set-Content -Path dist\HUONG_DAN_SU_DUNG.txt -Encoding UTF8
          Compress-Archive -Path dist\win-dynamic-island.exe, dist\HUONG_DAN_SU_DUNG.txt -DestinationPath dist\WinDynamicIsland-win64.zip -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/WinDynamicIsland-Setup.exe
            dist/WinDynamicIsland-Setup.exe.sha256
            dist/win-dynamic-island.exe
            dist/win-dynamic-island.exe.sha256
            dist/WinDynamicIsland-win64.zip
